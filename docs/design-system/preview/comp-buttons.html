<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 20px; background: var(--lc-neutral-50); font-family: var(--lc-font-sans); }
  .label { font-size: 10px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--lc-neutral-400); margin: 0 0 10px; }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 16px; }
  button { cursor: pointer; font-family: var(--lc-font-sans); }

  /* Primary */
  .btn-primary { background: var(--lc-teal-600); color: white; border: none; border-radius: var(--lc-radius-full); padding: 0 20px; height: 44px; font-size: 14px; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; transition: background 150ms ease-out; }
  .btn-primary:hover { background: var(--lc-teal-700); }

  /* Outline */
  .btn-outline { background: transparent; color: var(--lc-teal-600); border: 1.5px solid var(--lc-teal-600); border-radius: var(--lc-radius-full); padding: 0 20px; height: 44px; font-size: 14px; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; transition: background 150ms; }
  .btn-outline:hover { background: var(--lc-teal-50); }

  /* Ghost */
  .btn-ghost { background: transparent; color: var(--lc-neutral-600); border: none; border-radius: var(--lc-radius-full); padding: 0 16px; height: 44px; font-size: 14px; font-weight: 500; display: inline-flex; align-items: center; gap: 6px; transition: background 150ms; }
  .btn-ghost:hover { background: var(--lc-neutral-150); color: var(--lc-neutral-900); }

  /* Danger */
  .btn-danger { background: var(--lc-red-600); color: white; border: none; border-radius: var(--lc-radius-full); padding: 0 20px; height: 44px; font-size: 14px; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; transition: background 150ms; }
  .btn-danger:hover { background: var(--lc-red-700); }

  /* Small */
  .btn-sm { height: 34px; padding: 0 14px; font-size: 13px; }

  /* Disabled */
  .btn-disabled { opacity: 0.4; cursor: not-allowed; pointer-events: none; }

  /* Icon button */
  .btn-icon { width: 44px; height: 44px; padding: 0; border-radius: var(--lc-radius-md); display: inline-flex; align-items: center; justify-content: center; }

  .divider { width: 1px; height: 32px; background: var(--lc-neutral-150); }
  .state-label { font-size: 9px; color: var(--lc-neutral-400); text-align: center; margin-top: 4px; }
  .state-col { display: flex; flex-direction: column; align-items: center; gap: 2px; }
</style>
</head>
<body>
<div class="label">Primary buttons</div>
<div class="row">
  <div class="state-col">
    <button class="btn-primary">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
      Salvar sessão
    </button>
    <div class="state-label">Default</div>
  </div>
  <div class="state-col">
    <button class="btn-primary" style="background:var(--lc-teal-700)">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
      Salvar sessão
    </button>
    <div class="state-label">Hover</div>
  </div>
  <div class="state-col">
    <button class="btn-primary btn-disabled">Salvar sessão</button>
    <div class="state-label">Disabled</div>
  </div>
  <div class="state-col">
    <button class="btn-primary btn-sm">Salvar sessão</button>
    <div class="state-label">Small</div>
  </div>
</div>

<div class="label">Secondary &amp; utility buttons</div>
<div class="row">
  <div class="state-col">
    <button class="btn-outline">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
      Copiar mensagem
    </button>
    <div class="state-label">Outline</div>
  </div>
  <div class="state-col">
    <button class="btn-ghost">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
      Voltar
    </button>
    <div class="state-label">Ghost</div>
  </div>
  <div class="state-col">
    <button class="btn-danger">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>
      Remover
    </button>
    <div class="state-label">Danger</div>
  </div>
  <div class="divider"></div>
  <div class="state-col">
    <button class="btn-primary btn-icon" style="border-radius:var(--lc-radius-full)">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
    </button>
    <div class="state-label">Icon round</div>
  </div>
  <div class="state-col">
    <button class="btn-ghost btn-icon">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    </button>
    <div class="state-label">Icon ghost</div>
  </div>
</div>
</body>
</html>
